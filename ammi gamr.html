<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Greedy Student Game</title>
    <style>
        body { margin: 0; background: #1a1a2e; color: white; font-family: 'Arial', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #gameCanvas { background: #16213e; border: 4px solid #0f3460; border-radius: 15px; cursor: none; box-shadow: 0 0 50px rgba(0, 210, 255, 0.3); }
        .ui { position: absolute; top: 20px; left: 20px; font-size: 24px; pointer-events: none; }
        #gameOver { position: absolute; display: none; text-align: center; background: rgba(0,0,0,0.9); padding: 40px; border-radius: 20px; border: 2px solid #e94560; }
        button { background: #e94560; color: white; border: none; padding: 10px 20px; font-size: 18px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="ui">Score: <span id="score">0</span></div>

    <canvas id="gameCanvas"></canvas>

    <div id="gameOver">
        <h1 style="color: #e94560;">AMMI KI CHAPPAL LAG GAYI! 😂</h1>
        <p>Aap Fail ho gaye!</p>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="location.reload()">Dobara Parhai Karo</button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const gameOverEl = document.getElementById('gameOver');
    const finalScoreEl = document.getElementById('finalScore');

    canvas.width = 800;
    canvas.height = 500;

    let score = 0;
    let gameActive = true;
    let player = { x: 400, y: 250, size: 40 };
    let items = []; // Degrees aur Chappals

    // Mouse movement
    canvas.addEventListener('mousemove', (e) => {
        if (!gameActive) return;
        let rect = canvas.getBoundingClientRect();
        player.x = e.clientX - rect.left;
        player.y = e.clientY - rect.top;
    });

    // Item types: 🎓 (Degree), 📚 (Book), 🩴 (Chappal), 📄 (Fail Card)
    function spawnItem() {
        if (!gameActive) return;
        const types = [
            { icon: '🎓', score: 10, danger: false },
            { icon: '📚', score: 5, danger: false },
            { icon: '🩴', score: 0, danger: true },
            { icon: '📄', score: 0, danger: true }
        ];
        
        let type = types[Math.floor(Math.random() * types.length)];
        items.push({
            x: Math.random() * canvas.width,
            y: -50,
            speed: 2 + Math.random() * 4,
            ...type
        });

        setTimeout(spawnItem, 800); // Har 0.8 sec baad naya item
    }

    function update() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw Player (Student Emoji)
        ctx.font = "40px Arial";
        ctx.fillText("👨‍🎓", player.x - 20, player.y + 15);

        // Update & Draw Items
        for (let i = items.length - 1; i >= 0; i--) {
            items[i].y += items[i].speed;

            // Draw Item
            ctx.font = "30px Arial";
            ctx.fillText(items[i].icon, items[i].x, items[i].y);

            // Collision Detection
            let dist = Math.hypot(player.x - items[i].x, player.y - items[i].y);
            if (dist < 35) {
                if (items[i].danger) {
                    endGame();
                } else {
                    score += items[i].score;
                    scoreEl.innerText = score;
                    items.splice(i, 1);
                }
                continue;
            }

            // Remove items that fall off screen
            if (items[i].y > canvas.height + 50) {
                items.splice(i, 1);
            }
        }

        requestAnimationFrame(update);
    }

    function endGame() {
        gameActive = false;
        gameOverEl.style.display = "block";
        finalScoreEl.innerText = score;
    }

    spawnItem();
    update();
</script>
</body>
</html>
